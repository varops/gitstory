[workspace]
resolver = "3"
members = ["proto", "cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/varops/gitstory"

[workspace.dependencies]
gitstory-proto = { path = "proto" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
blake3 = "1.8"
rusqlite = { version = "0.37", features = ["bundled"] }
toml = "0.9"
ureq = { version = "3", features = ["json"] }
regex = "1"
humantime = "2"
ignore = "0.4"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
